<!DOCTYPE html>
<html>
<head>
    <title>MovieFlix</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            background-color:black;
            color:white;
        }

        .header{
    height:100vh;
    background:
    linear-gradient(
        rgba(0,0,0,0.6),
        rgba(0,0,0,0.6)
    ),
    url('netflix.jpg');

    background-size:cover;
    background-position:center;
}

        .navbar{
            display:flex;
            justify-content:space-between;
            align-items:center;
            padding:20px 50px;
        }

        .logo{
            color:red;
            font-size:40px;
            font-weight:bold;
        }

        .btn{
            background:red;
            color:white;
            border:none;
            padding:10px 20px;
            border-radius:5px;
            cursor:pointer;
        }

        .content{
            text-align:center;
            margin-top:180px;
        }

        .content h1{
            font-size:50px;
            margin-bottom:20px;
        }

        .content p{
            font-size:22px;
            margin-bottom:20px;
        }

        input{
            padding:12px;
            width:300px;
            border:none;
            border-radius:5px;
        }

        .start-btn{
            padding:12px 20px;
            background:red;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;
        }

        .movies{
            padding:40px;
        }

        .movies h2{
            margin-bottom:20px;
        }

        .movie-list{
            display:flex;
            gap:60px;
            flex-wrap:wrap;
        }

        .card{
            width:200px;
            height:250px;
            background:#222;
            border-radius:10px;
            display:flex;
            justify-content:center;
            align-items:center;
            font-size:20px;
        }

        footer{
            text-align:center;
            padding:20px;
            background:#111;
        }
    </style>

</head>
<body>

    <div class="header">
        

        <div class="navbar">
            <div class="logo">MOVIEFLIX</div>
            <button class="btn">Sign In</button>
        </div>

        <div class="content">
            <h1>Unlimited Movies, TV Shows and More</h1>
            <p>Watch anywhere. Cancel anytime.</p>

            <input type="email" placeholder="Enter your email">
            <button class="start-btn">Get Started</button>
        </div>

    </div>
        
    <div class="movies">
        <h2>Popular Movies</h2>
        <br><br>

        <div class="movie-list">
            <div class="card"><img src="movie1.avif" alt="" height="300"></div>
            <div class="card"><img src="movie2.webp" alt="" height="300"></div>
            <div class="card"><img src="movie3.avif" alt="" height="300"></div>
            <div class="card"><img src="movie4.webp" alt="" height="300"></div>
        </div>
    </div>
        <br><br>
    <footer>
        
        © 2026 MovieFlix
    </footer>

</body>
</html>0
