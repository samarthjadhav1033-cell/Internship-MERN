<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>printing initial letter of name</h1>
    <script>
        for (let i = 1; i <= 7; i++) {
    for (let j = 1; j <= 7; j++) {

        if (
            (i == 1 || i == 4 || i == 7) ||   // Horizontal lines
            (i < 4 && j == 1) ||              // Upper left vertical line
            (i > 4 && j == 7)                 // Lower right vertical line
        ) {
            document.write("*");
        } else {
            document.write(" ");
        }
    }
    document.write();
}
    </script>
</body>
</html>
