<!DOCTYPE html>
<html lang="en">

    <meta charset="UTF-8">

<body>
    <h1> nested if </h1>
    <script>
        let num =Number(prompt("enter number"))

if (num > 0) {
    if (num % 2 == 0) {
        console.log("Positive Even Number");
    } else {
        console.log("Positive Odd Number");
    }
} else {
    console.log("Number is not positive");
}
    </script>
</body>
</html>
