<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>
    <link rel="stylesheet" href="style1.css">
</head>
<body>

<div class="card">

    <div class="circle"></div>

    <div class="profile">
        <img src="profile.jpg" alt="Profile">
    </div>

    <div class="content">
        <h1>Bradley Steve</h1>
        <h3>@bradsteve</h3>

        <p>
            I'm a Front End Developer, follow me to be the 
            first who see my new work.
        </p>

        <div class="stats">
            <div>
                <h2>15K</h2>
                <span>Views</span>
            </div>
            <div>
                <h2>82</h2>
                <span>Projects</span>
            </div>
            <div>
                <h2>1.3M</h2>
                <span>Followers</span>
            </div>
        </div>

        <div class="buttons">
            <button class="follow">Follow</button>
            <button class="profile-btn">View profile</button>
        </div>
    </div>

</div>

</body>
</html>
