<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation</title>

<style>

body{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:rgb(91, 188, 220);
}

.face{
    width:300px;
    height:300px;
    background:yellow;
    border-radius:50%;
    position:relative;
    animation:bounce 1s infinite;
}

.eye{
    width:35px;
    height:35px;
    background:black;
    border-radius:50%;
    position:absolute;
    top:100px;
}

.left{
    left:60px;
}

.right{
    right:60px;
}

.mouth{
    width:140px;
    height:70px;
    border:10px solid black;
    border-top:none;
    border-left:none;
    border-right:none;
    position:absolute;
    left:78px;
    top:150px;
    border-radius:0 0 50px 50px;
}

@keyframes bounce{
    50%{ 
        transform:translateY(-100px);
    } 
}

</style>
</head>

<body>

    <div class="face">
    <div class="eye left"></div>
    <div class="eye right"></div>
    <div class="mouth"></div>
</div>

</body>
</html>
