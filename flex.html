<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Navbar</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height: 2000px;
    margin: 0;
    background-image: url("navimg.avif");
    background-size: cover;
    background-repeat: no-repeat;
    background-position: center;
    background-attachment: fixed;
}

nav{
    width:100%;
    height:80px;
    background:rgb(149,216,235);
    background: rgba(0, 0, 0, 0.3);
    border:1px solid;
    border-radius:10px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    position:fixed;
    top:20px;
    
    padding:0 30px;
}

h1{
    color:white;
}

ul{
    display:flex;
    list-style:none;
    gap:40px;
}

li{
    cursor:pointer;
    font-size:18px;
    font-weight:bold;
}

li:hover{
    color:white;
}
h2{
    color: aliceblue;
    display: flex;
    justify-content: center;
    margin-top: 200px;
}
</style>
</head>

<body>

<nav>
    <h1>Company</h1>

    <ul>
        <li>Home</li>
        <li>About</li>
        <li>Services</li>
        <li>Contact</li>
    </ul>
</nav>
    <h2>
        Welcome To Our Website
    </h2>

</body>
</html>
