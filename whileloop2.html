<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Print 10 to 1 numbers</h1>
    <script>
        
        var a=10;
        while (a>=1) {
            document.write(a,"\n")
            a--;
        }

    </script>
</body>
</html>
